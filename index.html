<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الإخوة شوب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root { --main:#2b2420; --accent:#b8863b; --bg:#f6f1e8; --line:#d9cdb6; }
  * { box-sizing:border-box; margin:0; padding:0; font-family:'Cairo', sans-serif; }
  body { background:var(--bg); color:var(--main); line-height:1.6; }
  
  header { display:flex; justify-size:space-between; align-items:center; padding:1rem 5%; background:#fff; border-bottom:1px solid var(--line); }
  .logo { font-size:1.5rem; font-weight:900; }
  .logo span { color:var(--accent); }
  
  .products-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:1.5rem; padding:2rem 5%; }
  .product-card { background:#fff; border:1px solid var(--line); border-radius:8px; overflow:hidden; cursor:pointer; transition:transform .2s; }
  .product-card:hover { transform:translateY(-3px); }
  .product-img img { width:100%; height:200px; object-fit:cover; }
  .product-info { padding:1rem; }
  .product-price { color:var(--accent); font-weight:700; font-size:1.2rem; }
  
  /* نافذة تفاصيل المنتج (Modal) */
  .modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); justify-content:center; align-items:center; z-index:1000; }
  .modal-content { background:#fff; width:90%; max-width:600px; border-radius:8px; padding:1.5rem; position:relative; max-height:90vh; overflow-y:auto; }
  .close-btn { position:absolute; top:10px; left:15px; font-size:1.5rem; cursor:pointer; font-weight:bold; }
  .modal-img img { width:100%; max-height:300px; object-fit:contain; border-radius:6px; }
  .btn-buy { background:var(--main); color:#fff; border:none; padding:0.8rem 1.5rem; width:100%; margin-top:1rem; border-radius:4px; cursor:pointer; font-size:1rem; font-weight:700; }
  .btn-buy:hover { background:var(--accent); }
</style>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

<header>
  <div class="logo">الإخوة <span>شوب</span></div>
</header>

<div class="products-grid" id="productsGrid">
  <p>جاري تحميل المنتجات...</p>
</div>

<!-- نافذة التفاصيل -->
<div class="modal-overlay" id="productModal">
  <div class="modal-content">
    <span class="close-btn" onclick="closeModal()">&times;</span>
    <div id="modalBody"></div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBo0Dk-Ye319DQ2xhi_oAUH5WtvsDlL55Y",
  authDomain: "al-ikhwa.firebaseapp.com",
  projectId: "al-ikhwa",
  storageBucket: "al-ikhwa.firebasestorage.app",
  messagingSenderId: "746201902197",
  appId: "1:746201902197:web:f817955db1a209df1e1c3c"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let allProducts = [];

db.collection('products').get().then(snapshot => {
  allProducts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
  renderProducts(allProducts);
}).catch(err => {
  document.getElementById('productsGrid').innerHTML = '<p>حدث خطأ أثناء جلب البيانات.</p>';
});

function renderProducts(products) {
  const grid = document.getElementById('productsGrid');
  if(!products.length) {
    grid.innerHTML = '<p>لا توجد منتجات حالياً.</p>';
    return;
  }
  
  grid.innerHTML = products.map(p => {
    const mainImg = p.image || (p.images && p.images[0]) || '';
    return `
      <div class="product-card" onclick="openProductModal('${p.id}')">
        <div class="product-img">
          <img src="${mainImg}" alt="${p.name}">
        </div>
        <div class="product-info">
          <h3>${p.name}</h3>
          <div class="product-price">${p.price} د.ج</div>
        </div>
      </div>
    `;
  }).join('');
}

function openProductModal(id) {
  const product = allProducts.find(p => p.id === id);
  if(!product) return;
  
  const mainImg = product.image || (product.images && product.images[0]) || '';
  const modalBody = document.getElementById('modalBody');
  
  modalBody.innerHTML = `
    <div class="modal-img">
      <img src="${mainImg}" alt="${product.name}">
    </div>
    <h2 style="margin-top:1rem;">${product.name}</h2>
    <p style="color:var(--accent); font-weight:bold; font-size:1.3rem; margin:0.5rem 0;">${product.price} د.ج</p>
    <p>${product.description || 'لا يوجد وصف متاح.'}</p>
    <button class="btn-buy" onclick="addToCart('${product.id}')">أضف إلى السلة</button>
  `;
  
  document.getElementById('productModal').style.display = 'flex';
}

function closeModal() {
  document.getElementById('productModal').style.display = 'none';
}

function addToCart(id) {
  alert('تمت إضافة المنتج إلى السلة');
  closeModal();
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آيات ومطر - سكينة واسترخاء</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <header>
            <h1>🌧️ آيات ومطر</h1>
            <p>تلاوات قرآنية خاشعة مع أصوات الطبيعة الهادئة</p>
        </header>

        <!-- قسم مشغل القرآن -->
        <div class="card">
            <h2>📖 التلاوة القرآنية</h2>
            <div class="select-group">
                <label for="surahSelect">اختر السورة أو القارئ:</label>
                <select id="surahSelect">
                    <!-- عينات تلاوات حية من إذاعة القرآن الكريم أو مصادر موثوقة -->
                    <option value="https://server11.mp3quran.net/sds/056.mp3">سورة الواقعة - عبد الرحمن السديس</option>
                    <option value="https://server11.mp3quran.net/sds/067.mp3">سورة الملك - عبد الرحمن السديس</option>
                    <option value="https://server7.mp3quran.net/ibrahim/055.mp3">سورة الرحمن - إبراهيم الأخضر</option>
                    <option value="https://server8.mp3quran.net/shur/012.mp3">سورة يوسف - سعود الشريم</option>
                </select>
            </div>
            
            <audio id="quranAudio" loop></audio>
            
            <div class="player-controls">
                <button id="quranPlayBtn" class="btn primary-btn">تشغيل القرآن</button>
            </div>
            
            <div class="volume-control">
                <label for="quranVolume">مستوى صوت القرآن:</label>
                <input type="range" id="quranVolume" min="0" max="1" step="0.1" value="0.8">
            </div>
        </div>

        <!-- قسم مشغل أصوات المطر -->
        <div class="card">
            <h2>🌧️ أصوات الطبيعة (المطر)</h2>
            <audio id="rainAudio" loop src="https://assets.mixkit.co/active_storage/sfx/1255/1255-preview.mp3"></audio>
            
            <div class="player-controls">
                <button id="rainPlayBtn" class="btn secondary-btn">تشغيل المطر</button>
            </div>
            
            <div class="volume-control">
                <label for="rainVolume">مستوى صوت المطر:</label>
                <input type="range" id="rainVolume" min="0" max="1" step="0.1" value="0.5">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
